<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" />
  
  <!-- Menu Icon (Three horizontal lines) -->
  <rect x="55" y="65" width="90" height="10" rx="5" fill="white" />
  <rect x="55" y="95" width="90" height="10" rx="5" fill="white" />
  <rect x="55" y="125" width="60" height="10" rx="5" fill="white" />
  
  <!-- User/Role indicator (circle) -->
  <circle cx="135" cy="130" r="15" fill="white" opacity="0.9" />
  <circle cx="135" cy="130" r="10" fill="#0d6efd" />
</svg>